[package]
name = "sandbox_engine"
version = "0.1.0"
edition = "2021"
description = "Motor de seguridad y análisis estático de alta velocidad en Rust para Folder AI"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
